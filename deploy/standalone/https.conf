[Unit]
Requires=gramstat-https.socket
After=gramstat-https.socket

[Service]
LoadCredential=origin.pem:/etc/gramstat/tls/stats.ton.org.pem
LoadCredential=origin.key:/etc/gramstat/tls/stats.ton.org.key
ExecStart=
ExecStart=/opt/gramstat/bin/gramstat-api --web --listen 127.0.0.1:2007 --tls-cert %d/origin.pem --tls-key %d/origin.key
