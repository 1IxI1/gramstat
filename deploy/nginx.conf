# Included in nginx's http context, behind the local TLS virtual host.
# Neither this static/API origin nor the Go API has a network-facing listener.
limit_req_zone $binary_remote_addr zone=gramstat_api:10m rate=5r/s;
limit_req_zone $server_name zone=gramstat_api_global:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=gramstat_clients:10m;
limit_conn_zone $server_name zone=gramstat_connections:1m;
log_format gramstat '$remote_addr peer=$realip_remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent request_time=$request_time';
server {
    listen 127.0.0.1:2007;
    server_name _;
    # Only the local TLS vhost can supply this header; it overwrites client input.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Real-IP;
    root /opt/gramstat/ui;
    access_log /var/log/nginx/gramstat-access.log gramstat;
    error_log /var/log/nginx/gramstat-error.log;
    server_tokens off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 20s;
    keepalive_timeout 15s;
    keepalive_requests 100;
    limit_conn gramstat_clients 32;
    limit_conn gramstat_connections 128;
    limit_conn_status 429;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length !~ ^(0)?$) { return 400; }
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'; frame-src 'none'; worker-src 'none'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    location /api/ {
        limit_except GET { deny all; }
        limit_req zone=gramstat_api burst=20 nodelay;
        limit_req zone=gramstat_api_global burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2008;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 20s;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Transfer-Encoding "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = / { try_files /index.html =404; }
    location ~ ^/fonts/InterVariable(-Italic)?\.woff2$ {
        limit_except GET { deny all; }
        types { font/woff2 woff2; }
        expires 7d;
        try_files $uri =404;
    }
    location ~ ^/(index\.html|app\.mjs|scroll-brand\.mjs|catalogue\.mjs|charts\.mjs|data\.mjs|action-types\.mjs|account-types\.mjs|wire\.mjs|time-ranges\.mjs|wallet-registry\.mjs|wallet-activations\.mjs|stake-registry\.mjs|validator-map\.mjs|style\.css|favicon\.svg|ton-mark\.svg|world-map\.svg)$ {
        limit_except GET { deny all; }
        types { text/html html; text/javascript mjs; text/css css; image/svg+xml svg; }
        expires -1;
        try_files $uri =404;
    }
    # Historic snapshots, provenance, tests and repository files are not public.
    location / { return 404; }
}
