# Include in nginx's http context. Install the geo file there too, and the
# real-IP snippet at the path below. Certificate paths are deployment-specific.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stats.ton.org;
    access_log /var/log/nginx/gramstat-edge-access.log gramstat;
    error_log /var/log/nginx/gramstat-edge-error.log;
    server_tokens off;
    ssl_certificate /etc/nginx/ssl/ton.org.origin.pem;
    ssl_certificate_key /etc/nginx/ssl/ton.org.origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    include /etc/nginx/snippets/gramstat-cloudflare-realip.conf;
    # Test the original TCP peer, not the visitor address restored by realip.
    if ($gramstat_trusted_edge = 0) { return 444; }
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    send_timeout 20s;
    keepalive_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:2007;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 25s;
        proxy_set_header Host stats.ton.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name stats.ton.org;
    access_log /var/log/nginx/gramstat-edge-access.log gramstat;
    error_log /var/log/nginx/gramstat-edge-error.log;
    server_tokens off;
    if ($gramstat_trusted_edge = 0) { return 444; }
    return 301 https://stats.ton.org$request_uri;
}
